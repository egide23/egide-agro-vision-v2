```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Africa AgroVision</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<section class="register-section">

    <div class="register-container">

        <h1>Create Your Account</h1>

        <p>
            Join Africa AgroVision and become part of Africa's
            agricultural future.
        </p>

        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
                minlength="6"
            >

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
                minlength="6"
            >

            <button type="submit" id="registerButton">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

    </div>

</section>


<script>

// ==========================================
// SUPABASE CONNECTION
// ==========================================

const SUPABASE_URL =
    "https://fhvyncltdliduhhfqzqq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_b2M9akZhcgz5KjOZQ1mPtA_aNXZhv6J";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


// ==========================================
// REGISTRATION
// ==========================================

document.getElementById("registerForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim().toLowerCase();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const registerButton =
            document.getElementById("registerButton");


        // Check passwords

        if (password !== confirmPassword) {

            alert("Passwords do not match.");

            return;
        }


        // Check password length

        if (password.length < 6) {

            alert("Password must be at least 6 characters.");

            return;
        }


        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            name: name
                        }

                    }

                });


            if (error) {

                console.error(error);

                alert(error.message);

                return;
            }


            console.log("User created:", data);


            if (data.user && !data.session) {

                alert(
                    "Registration successful! Please check your email and confirm your account before logging in."
                );

            } else {

                alert(
                    "Registration successful! You can now login."
                );

            }


            window.location.replace("login.html");


        } catch (error) {

            console.error(error);

            alert(
                "Something went wrong. Please try again."
            );

        } finally {

            registerButton.disabled = false;
            registerButton.textContent = "Create Account";

        }

    }
);

</script>

</body>

</html>
