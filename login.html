<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Africa AgroVision</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =====================================================
           AFRICA AGROVISION — LOGIN PAGE
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #12351f;

            background-image:
                linear-gradient(
                    135deg,
                    rgba(4, 35, 17, 0.58),
                    rgba(16, 78, 35, 0.38),
                    rgba(3, 31, 15, 0.68)
                ),
                url("https://images.unsplash.com/photo-1516467508483-a7212febe31a?auto=format&fit=crop&w=2200&q=90") !important;

            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;

            color: #173a23;
        }


        /* =====================================================
           PAGE LAYER
        ===================================================== */

        .register-section {
            width: 100%;
            min-height: 100vh;

            margin: 0;
            padding: 45px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent !important;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .register-container {
            position: relative;

            width: 100%;
            max-width: 500px;

            padding: 42px 42px 38px;

            background: rgba(255, 255, 255, 0.96) !important;

            border: 1px solid rgba(255, 255, 255, 0.75);

            border-top: 5px solid #1b5e20;

            border-radius: 26px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.38);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            animation: loginCardAppear 0.7s ease;
        }


        @keyframes loginCardAppear {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand-mark {
            width: 52px;
            height: 52px;

            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #12351f,
                    #2e7d32
                );

            color: white;

            font-size: 17px;
            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 8px 20px rgba(27, 94, 32, 0.22);
        }


        .brand-name {
            margin-bottom: 9px;

            color: #1b5e20;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .register-container h1 {
            margin: 0 0 10px;

            color: #102f1b;

            font-size: 34px;
            font-weight: 800;

            line-height: 1.15;
        }


        .intro-text {
            margin: 0 0 30px;

            color: #627066;

            font-size: 15px;

            line-height: 1.65;
        }


        /* =====================================================
           FORM
        ===================================================== */

        #loginForm {
            width: 100%;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .register-container label {
            display: block;

            margin-bottom: 8px;

            color: #183d25;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 0.2px;
        }


        .input-wrapper {
            position: relative;
        }


        .register-container input {
            width: 100%;

            min-height: 52px;

            padding: 14px 16px;

            border: 1px solid #d1ddd5;

            border-radius: 13px;

            background: #f8fbf9;

            color: #173a23;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        .register-container input::placeholder {
            color: #98a49d;
        }


        .register-container input:hover {
            border-color: #aebeb4;
        }


        .register-container input:focus {
            border-color: #2e7d32;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(46, 125, 50, 0.11);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        #loginButton {
            width: 100%;

            min-height: 53px;

            margin-top: 4px;

            padding: 14px 20px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #123f20,
                    #1b6b2a,
                    #2e7d32
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 15px;
            font-weight: 800;

            letter-spacing: 0.2px;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(27, 94, 32, 0.24);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                opacity 0.25s ease;
        }


        #loginButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(27, 94, 32, 0.32);
        }


        #loginButton:active {
            transform: translateY(0);
        }


        #loginButton:disabled {
            opacity: 0.72;

            cursor: not-allowed;

            transform: none;
        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        .login-link {
            margin: 24px 0 0 !important;

            padding-top: 20px;

            border-top: 1px solid #e5ebe7;

            color: #69766e !important;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;
        }


        .login-link a {
            color: #1b5e20 !important;

            font-weight: 800;

            text-decoration: none;

            transition: color 0.2s ease;
        }


        .login-link a:hover {
            color: #2e7d32 !important;

            text-decoration: underline;
        }


        /* =====================================================
           TRUST MESSAGE
        ===================================================== */

        .trust-message {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color: #708078;

            font-size: 11px;

            text-align: center;
        }


        .trust-icon {
            width: 18px;
            height: 18px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e7f3e9;

            color: #23712c;

            font-size: 10px;
            font-weight: 900;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                background-attachment: scroll !important;
            }


            .register-section {
                min-height: 100vh;

                padding: 25px 15px;
            }


            .register-container {
                max-width: 100%;

                padding: 32px 24px 28px;

                border-radius: 21px;
            }


            .register-container h1 {
                font-size: 29px;
            }


            .intro-text {
                font-size: 14px;

                margin-bottom: 25px;
            }


            .brand-mark {
                width: 48px;
                height: 48px;
            }
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .register-container {
                padding: 28px 19px 25px;
            }


            .register-container h1 {
                font-size: 26px;
            }


            .register-container input {
                min-height: 49px;
            }


            #loginButton {
                min-height: 50px;
            }
        }

    </style>

</head>


<body>


<section class="register-section">


    <div class="register-container">


        <!-- BRAND -->

        <div class="brand-mark">
            AA
        </div>

        <div class="brand-name">
            AFRICA AGROVISION
        </div>


        <!-- HEADING -->

        <h1>
            Welcome Back
        </h1>


        <p class="intro-text">
            Sign in to continue exploring agricultural
            knowledge, livestock farming, innovation,
            and opportunities across Africa.
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- CREATE ACCOUNT -->

        <p class="login-link">

            Don't have an account?

            <a href="register.html">
                Create one here
            </a>

        </p>


        <!-- TRUST -->

        <div class="trust-message">

            <span class="trust-icon">
                ✓
            </span>

            Secure account access powered by Africa AgroVision

        </div>


    </div>


</section>


<script>


// =====================================================
// SUPABASE CONNECTION
// =====================================================

const SUPABASE_URL =
    "https://fhvyncltdliduhhfqzqq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_b2M9akZhcgz5KjOZQ1mPtA_aNXZhv6J";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



// =====================================================
// LOGIN
// =====================================================

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            // Disable button

            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";


            try {


                // Sign in with Supabase

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                // Login failed

                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    alert(error.message);

                    return;
                }


                // Login successful

                console.log(
                    "Login successful:",
                    data
                );


                alert(
                    "Login successful!"
                );


                // Open dashboard

                window.location.href =
                    "dashboard.html";


            }


            catch (error) {

                console.error(
                    "Unexpected error:",
                    error
                );


                alert(
                    "Something went wrong. Please try again."
                );

            }


            finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
